<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar-se | Clinica Médica</title>

<body>
    <header>
        <nav> 
            <ul>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#">Sobre nós</a></li>
                    <li><a href="login.html">Entrar</a></li>
                    <li><a href="cadastrar.html">Registrar-se</a></li>
                </ul>
            </ul>
        </nav> 
    </header>
    <main>
        <h1 id="title">Registre-se: Preencha as informações</h1>
        <form name="credenciais" onsubmit="return checkCredenciais()">
            <div class="input-account">
                <label for="user-register">Usuário:</label>
                <input type="text" id="user-register" name="user-register" required>
                <label for="password-register">Senha:</label>
                <input type="text" id="password-register" name="password-register" required>
                <label for="tell-register">CPF:</label>
                <input type="text" id="cpf-register" name="cpf-register" placeholder="Somente números:" required>
                <input type="submit" value="Registrar-se">
                <p>Já possui registro? <a href="login.html">Entrar</a></p>
            </div>
        </form> 
    </main>
<footer>

</body>
</html>
